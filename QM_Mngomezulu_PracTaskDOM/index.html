<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel">
        <h1>Shopping Product Manager</h1>
        <p class="subtitle">Create, update, delete, and view all products in one table.</p>

        <form id="productForm" class="form-grid" autocomplete="off">
          <input type="text" id="productName" placeholder="Product name" required />
          <input type="number" id="productQty" placeholder="Quantity" min="1" required />
          <input type="number" id="productPrice" placeholder="Price" min="0" step="0.01" required />

          <div class="button-row">
            <button type="submit" id="saveBtn" class="btn btn-primary">Create Product</button>
            <button type="button" id="viewAllBtn" class="btn btn-secondary">View All</button>
            <button type="button" id="cancelEditBtn" class="btn btn-warning hidden">Cancel Edit</button>
          </div>
        </form>

        <p id="statusMessage" class="status"></p>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Bought</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
